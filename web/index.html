<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/libs/font-awesome/css/font-awesome.min.css" rel="stylesheet" />
    <link href="/libs/slidercaptcha.css" rel="stylesheet" />
    <title>%VITE_APP_NAME%</title>

    <style>
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      * {
        box-sizing: border-box;
      }
      .loader {
        position: relative;
        margin: 75px auto;
        width: 160px;
        height: 160px;
        display: block;
        overflow: hidden;
      }
      .loader div {
        height: 100%;
      }

      /* loader 1 */
      .loader1,
      .loader1 div {
        border-radius: 50%;
        padding: 8px;
        border: 2px solid transparent;
        animation: rotate linear 3.5s infinite;
        border-top-color: #009b9e;
        border-bottom-color: #00b247;
      }

      /* div:hover {
        animation-play-state: paused;
      } */

      .loader,
      .loader * {
        will-change: transform;
      }
      .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #000000, #333333);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="loader-wrapper">
        <div class="loader loader1">
          <div>
            <div>
              <div>
                <div>
                  <div>
                    <div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script src="/libs/wwLogin-1.0.0.js"></script>
    <script src="/libs/slidercaptcha.js"></script>
